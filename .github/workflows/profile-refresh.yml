name: Refresh profile visuals

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: seijikohara/profile-cards-action@2ed855add28ddf605913673c5852fe3d647aab80
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: lucifer5051
          cards: overview
          output-dir: assets/profile-cards
          themes: light,dark
          palette: blue
          commit: false
      - uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: lucifer5051
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/profile-cards profile-3d-contrib
          git diff --cached --quiet || (git commit -m "chore(profile): refresh visuals [skip ci]" && git push)
